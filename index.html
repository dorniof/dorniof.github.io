<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анкета</title>

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f6f7f9;
  padding: 15px;
}

h2 {
  text-align: center;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 12px;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

textarea {
  resize: vertical;
  min-height: 80px;
}

.buttons {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

.send {
  background: #2ea6ff;
  color: white;
}

.back {
  background: #e0e0e0;
}
</style>
</head>

<body>

<h2>📝 Анкета</h2>

<label>Имя</label>
<input id="name">

<label>Возраст</label>
<input id="age" type="number">

<label>Пол</label>
<select id="gender">
  <option value="">Выберите</option>
  <option>Мужской</option>
  <option>Женский</option>
</select>

<label>Город</label>
<input id="city">

<label>Цель</label>
<select id="goal">
  <option value="">Выберите</option>
  <option>Обучение</option>
  <option>Доход</option>
  <option>Развитие</option>
  <option>Общение</option>
</select>

<label>Комментарий</label>
<textarea id="comment"></textarea>

<div class="buttons">
  <button class="back" onclick="goBack()">⬅️ Назад</button>
  <button class="send" onclick="sendForm()">✅ Отправить</button>
</div>

<script>
const tg = window.Telegram.WebApp;

// ВАЖНО: инициализация
tg.ready();

function goBack() {
  tg.close();
}

function sendForm() {
  const data = {
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    city: document.getElementById("city").value,
    goal: document.getElementById("goal").value,
    comment: document.getElementById("comment").value
  };

  // отправка данных в бот
  tg.sendData(JSON.stringify(data));

  // закрываем WebApp
  tg.close();
}
</script>

</body>
</html>
